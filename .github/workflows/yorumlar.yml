name: Trendyol yorumlarini tazele

on:
  # Otomatik cron KALDIRILDI (2026-08-19): GitHub Actions runner'larinin
  # paylasimli IP'si Trendyol tarafindan TAMAMEN engelleniyor - canli testte
  # 368/368 urun 429 aldi, guvenlik esigi eski veriyi korudu ama yeni veri
  # hic gelmedi. Zamanlama artik yerel makinede Windows Task Scheduler ile
  # yapiliyor (gorev: Cocukland-TrendyolYorumTazele, C:\Orvis\veri\cocukland-widgets\yerel_yorum_tazele.ps1).
  # workflow_dispatch elde tutuluyor - manuel/hata ayiklama icin hala isler.
  workflow_dispatch: {}

jobs:
  topla:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install requests

      - name: Yorumlari topla
        env:
          IKAS_MAGAZA: ${{ secrets.IKAS_MAGAZA }}
          IKAS_CLIENT_ID: ${{ secrets.IKAS_CLIENT_ID }}
          IKAS_CLIENT_SECRET: ${{ secrets.IKAS_CLIENT_SECRET }}
          TRENDYOL_SATICI_ID: ${{ secrets.TRENDYOL_SATICI_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
        run: python .github/scripts/yorumlar_topla.py

      - name: Guncelleme zaman damgasini ekle
        run: |
          python - <<'PY'
          import json, datetime
          p = "data/yorumlar.json"
          d = json.load(open(p, encoding="utf-8"))
          d["guncelleme"] = datetime.datetime.utcnow().isoformat() + "Z"
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False)
          PY

      - name: Degisiklik varsa commit'le
        run: |
          git config user.name "cocukland-bot"
          git config user.email "actions@github.com"
          git add data/yorumlar.json
          git diff --cached --quiet && echo "degisiklik yok" || git commit -m "Trendyol yorumlarini tazele [otomatik]"
          git push
